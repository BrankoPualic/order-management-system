<div class="container my-3">
    @if (product.hasValue()) {
    <h5>Information</h5>
    <div>
        <strong>Name:</strong>
        <div>{{ product.value().name }}</div>
    </div>
    <div class="mt-3">
        <strong>Description:</strong>
        <div>{{ product.value().description }}</div>
    </div>
    <div class="mt-3">
        <strong>Price:</strong>
        <div [innerHTML]="formatPrice(product.value().price)"></div>
    </div>

    <div class="my-3">
        <h5>Update Information</h5>
        <div>
            <label class="form-label">Name:</label>
            <input type="text" class="form-control" [(ngModel)]="productCopy().name" />
        </div>
        <div>
            <label class="form-label">Description:</label>
            <textarea rows="2" class="form-control" [(ngModel)]="productCopy().description"></textarea>
        </div>
        <div>
            <label class="form-label">Price:</label>
            <input type="number" step="0.01" class="form-control my-1" [(ngModel)]="productCopy().price.amount"
                placeholder="Amount" />
            <input type="text" class="form-control my-1" [(ngModel)]="productCopy().price.currency"
                placeholder="Currency" />
        </div>
        <button class="btn btn-primary mt-2" type="button" (click)="updateProduct()">Update</button>
    </div>

    <button class="btn btn-danger mt-3" type="button" (click)="deleteProduct()">Delete</button>
    }
    @else if (product.error()) {
    <div>Could not load product information</div>
    }
    @else if (product.isLoading()) {
    <div>Loading product info...</div>
    }
</div>
