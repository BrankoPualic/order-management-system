<div class="container my-5">
    @if (company.hasValue()) {
    <h5>Information</h5>
    <div>
        <strong>Name:</strong>
        <div>{{ company.value().name }}</div>
    </div>
    <div class="mt-3">
        <strong>Description:</strong>
        <div>{{ company.value().description }}</div>
    </div>
    <div class="mt-3">
        <strong>Address:</strong>
        <div [innerHTML]="formatAddress(company.value().address)"></div>
    </div>

    <div class="my-3">
        <h5>Update Information</h5>
        <div>
            <label class="form-label">Name:</label>
            <input type="text" class="form-control" [(ngModel)]="companyCopy().name" />
        </div>
        <div>
            <label class="form-label">Description:</label>
            <textarea rows="2" class="form-control" [(ngModel)]="companyCopy().description"></textarea>
        </div>
        <div>
            <label class="form-label">Address:</label>
            <input type="text" class="form-control my-1" [(ngModel)]="companyCopy().address.street"
                placeholder="Street" />
            <input type="text" class="form-control my-1" [(ngModel)]="companyCopy().address.city" placeholder="City" />
            <input type="text" class="form-control my-1" [(ngModel)]="companyCopy().address.state"
                placeholder="State" />
            <input type="text" class="form-control my-1" [(ngModel)]="companyCopy().address.country"
                placeholder="Country" />
            <input type="text" class="form-control my-1" [(ngModel)]="companyCopy().address.zipCode"
                placeholder="Zip Code" />
        </div>
        <button class="btn btn-primary mt-2" type="button" (click)="updateCompany()">Update</button>
    </div>

    <button class="btn btn-danger mt-3" type="button" (click)="deleteCompany()">Delete</button>
    }
    @else if (company.error()) {
    <div>Could not load company information</div>
    }
    @else if (company.isLoading()) {
    <div>Loading company info...</div>
    }
</div>
