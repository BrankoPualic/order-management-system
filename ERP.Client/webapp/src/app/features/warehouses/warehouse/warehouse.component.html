<div class="container my-3">
    @if (warehouse.hasValue()) {
    <h5>Information</h5>
    <div>
        <strong>Name:</strong>
        <div>{{ warehouse.value().name }}</div>
    </div>
    <div class="mt-3">
        <strong>Description:</strong>
        <div>{{ warehouse.value().description }}</div>
    </div>
    <div class="mt-3">
        <strong>Address:</strong>
        <div [innerHTML]="formatAddress(warehouse.value().address)"></div>
    </div>

    <div class="my-3">
        <h5>Update Information</h5>
        <div>
            <label class="form-label">Name:</label>
            <input type="text" class="form-control" [(ngModel)]="warehouseCopy().name" />
        </div>
        <div>
            <label class="form-label">Description:</label>
            <textarea rows="2" class="form-control" [(ngModel)]="warehouseCopy().description"></textarea>
        </div>
        <div>
            <label class="form-label">Address:</label>
            <input type="text" class="form-control my-1" [(ngModel)]="warehouseCopy().address.street"
                placeholder="Street" />
            <input type="text" class="form-control my-1" [(ngModel)]="warehouseCopy().address.city"
                placeholder="City" />
            <input type="text" class="form-control my-1" [(ngModel)]="warehouseCopy().address.state"
                placeholder="State" />
            <input type="text" class="form-control my-1" [(ngModel)]="warehouseCopy().address.country"
                placeholder="Country" />
            <input type="text" class="form-control my-1" [(ngModel)]="warehouseCopy().address.zipCode"
                placeholder="Zip Code" />
        </div>
        <button class="btn btn-primary mt-2" type="button" (click)="updateWarehouse()">Update</button>
    </div>

    <button class="btn btn-danger mt-3" type="button" (click)="deleteWarehouse()">Delete</button>
    }
    @else if (warehouse.error()) {
    <div>Could not load warehouse information</div>
    }
    @else if (warehouse.isLoading()) {
    <div>Loading warehouse info...</div>
    }
</div>
