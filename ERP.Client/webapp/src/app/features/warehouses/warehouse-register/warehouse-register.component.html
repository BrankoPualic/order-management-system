<div class="container my-3">
    <h3 class="border-bottom pb-2">Register Warehouse</h3>
    <form (submit)="onSubmit($event)">
        <div class="my-3">
            <h5>General Information</h5>
            <div>
                <label class="form-label">Name:</label>
                <input type="text" class="form-control" [formField]="warehouseForm.name">
            </div>
            <div>
                <label class="form-label">Description:</label>
                <textarea rows="10" class="form-control" [formField]="warehouseForm.description"></textarea>
            </div>
        </div>

        <app-address-form [address]="warehouseForm.address"></app-address-form>

        <button class="btn btn-primary" type="submit" [disabled]="!warehouseForm().valid()">Register</button>
    </form>
</div>
